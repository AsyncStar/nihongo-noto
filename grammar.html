<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="./logic/index.js" type="module"></script>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kiwi+Maru&family=Kosugi+Maru&family=M+PLUS+1:wght@100..900&display=swap" rel="stylesheet">

</head>
<body data-page="grammar">

<div id="title">

    <h1 class="topic inline">文法</h1>

        <a href="index.html">たんご</a>

    </button>

    <button class="link">
        <a href="kanji.html">漢字</a>

    </button>

</div>

<div data-section="vocab">

<div class="tab-section">
    <ul class="tabs">
        <li class="tab active" data-path="time.timeOfDay">Times of day</li>
        <li class="tab" data-path="time.dayTemporalDeixis">Day words</li>
        <li class="tab" data-path="time.weekTemporalDeixis">Week nouns</li>
        <li class="tab" data-path="time.monthTemporalDeixis">Month words</li>
        <li class="tab" data-path="time.yearTemporalDeixis">Year words</li>
    </ul>

    <div id="timeDest" class="destination">

    </div>
</div>
</div>
<div data-section="grammarNotes">

    <div class="tab-section">
        <ul class="tabs">
            <li class="tab active" data-path="general.aSoKo">あそこ</li>
            <li class="tab" data-path="general.particles">Particles</li>
            <li class="tab" data-path="general.positionWords">Positions</li>
            <li class="tab" data-path="general.questionWords">Questions</li>
        </ul>

        <div class="destination">

        </div>

    </div>

<div class="tab-section">
    <ul class="tabs">
        <li class="tab active" data-path="patterns.advicePatterns">Advice</li>
        <li class="tab" data-path="patterns.uncertaintyPatterns">Uncertainty</li>
        <li class="tab" data-path="patterns.statePatterns">State</li>
        <li class="tab" data-path="patterns.desirePatterns">Desire</li>
        <li class="tab" data-path="patterns.timePatterns">Time</li>
        <li class="tab" data-path="patterns.countingPatterns">Counting</li>
    </ul>

    <div class="destination">

    </div>

</div>
</div>


<dialog id="grammar-modal">
    <div id="grammar-modal-content">
        <div class="top-wrapper">
            <div class="modal-title">Title</div>
            <div class="modal-lesson">Lesson</div>

        </div>
        <div class="bottom-wrapper">
            <div class="modal-format">Format</div>
            <div class="modal-meaning">Meaning</div>
            <div class="modal-follows">
                <span class="innerHeader">Follows...</span> <br>
                <div id="followsWrapper"></div>
            </div>
            <div class="modal-chaining">
                <span class="innerHeader">Can be followed by... / Related patterns</span> <br>
                <div id="chainsWrapper"></div>
            </div>
            <div class="modal-notes"></div>
        </div>
    </div>

</dialog>

<dialog id="tile-modal">
    <div class="modal-content">
        <div class="modal-header"></div>
        <div class="modal-reading"></div>
        <div class="modal-meaning"></div>
        <div class="modal-notes"></div>
    </div>
</dialog>



</body>
</html>
